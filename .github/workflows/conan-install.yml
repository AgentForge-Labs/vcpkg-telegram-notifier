name: Public Conan2 C++ package verification
on:
  push:
    paths:
      - sdk/cpp/**
      - .github/workflows/conan-install.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conan-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Conan2 clean package construction
        shell: bash
        working-directory: sdk/cpp
        run: |
          set -euo pipefail
          python -m pip install 'conan>=2.28,<3'
          conan profile detect --force
          conan create . --build=missing
          conan list 'agentforge-telegram-notifier/*:*'
